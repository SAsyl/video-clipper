[project]
name = "video-clipper"
version = "0.1.0"
description = "Download a video by link and cut it with millisecond precision"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "yt-dlp>=2025.1.1",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
